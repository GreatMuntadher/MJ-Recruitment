<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
:root{--ink:#183d49;--gold:#b68a2b;--line:#dbe4e6;--muted:#68777d;--bg:#f4f7f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#25343a;font:14px/1.6 Tahoma,Arial}.wrap{max-width:1450px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{margin:0;color:var(--ink);font-size:24px}.who{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:14px}.card b{display:block;font-size:22px;color:var(--ink)}.filters{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:9px;background:#fff;border:1px solid var(--line);padding:12px;border-radius:10px;margin-bottom:12px}input,select,textarea,button{font:inherit;border:1px solid #cbd7da;border-radius:7px;padding:9px;background:#fff}button{cursor:pointer;background:var(--ink);color:#fff;border-color:var(--ink)}button.alt{background:#fff;color:var(--ink)}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px;border-bottom:1px solid #e8edef;text-align:right}th{background:#edf3f4;color:var(--ink);cursor:pointer;position:sticky;top:0}td.actions{display:flex;gap:6px}.empty{text-align:center;padding:32px;color:var(--muted)}dialog{border:0;border-radius:12px;padding:0;width:min(980px,94vw);max-height:90vh;box-shadow:0 18px 60px #0004}dialog::backdrop{background:#102a3388}.modal{padding:20px;overflow:auto;max-height:90vh}.modal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.section{border:1px solid var(--line);border-radius:8px;padding:12px}.section h3{margin:0 0 8px;color:var(--ink)}.row{display:grid;grid-template-columns:40% 60%;border-bottom:1px solid #edf1f2;padding:5px}.row span{color:var(--muted)}.exp{border-right:3px solid var(--gold);padding-right:9px;margin:8px 0}.edit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.edit textarea{grid-column:1/-1;min-height:90px}.history{width:100%;white-space:normal}.error{color:#a22;margin:8px 0}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.grid,.edit{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><div class="wrap"><header><div><h1>لوحة إدارة المرشحين</h1><div class="who" id="who"></div></div></header><div class="cards" id="cards"></div><div class="filters"><input id="q" placeholder="بحث بالرقم، الاسم، الهاتف أو البريد"><select id="job"><option value="">كل الوظائف</option></select><select id="status"><option value="">كل الحالات</option></select><input id="date" type="date"><input id="salary" type="number" min="0" placeholder="راتب متوقع حتى"><select id="exp"><option value="">كل الخبرات</option><option value="yes">لديه خبرة</option><option value="no">بدون خبرة</option></select></div><div class="table-wrap"><table><thead><tr><th data-sort="Candidate_ID">Candidate ID</th><th data-sort="full_name">الاسم الكامل</th><th>الهاتف</th><th>الوظيفة</th><th data-sort="Submission_Date">تاريخ التقديم</th><th data-sort="expected_salary">الراتب المتوقع</th><th>الخبرة</th><th data-sort="Status">الحالة</th><th>الإجراءات</th></tr></thead><tbody id="rows"></tbody></table></div></div><dialog id="dlg"><div class="modal"><div class="modal-head"><div><h2 id="title"></h2><span id="cid"></span></div><button class="alt" onclick="document.getElementById('dlg').close()">إغلاق</button></div><div id="details"></div><div class="edit"><select id="newStatus"></select><input id="statusNote" placeholder="ملاحظة تغيير الحالة"><textarea id="hrNotes" placeholder="ملاحظات HR الداخلية"></textarea><button id="save">حفظ الحالة والملاحظات</button><a id="print" target="_blank"><button type="button">عرض / طباعة</button></a></div><h3>سجل الحالات</h3><table class="history"><thead><tr><th>الوقت</th><th>من</th><th>إلى</th><th>الملاحظة</th></tr></thead><tbody id="history"></tbody></table><div class="error" id="err"></div></div></dialog><script>
let all=[],sortKey='Submission_Date',sortDir=-1,current='';const $=id=>document.getElementById(id),money=v=>v===''||v==null?'':Number(v).toLocaleString('en-US')+' IQD',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function load(){google.script.run.withSuccessHandler(init).withFailureHandler(fail).getHRDashboardData()}function init(d){all=d.candidates;$('who').textContent=d.email;$('status').innerHTML+=[...new Set(d.statuses)].map(x=>`<option>${esc(x)}</option>`).join('');$('job').innerHTML+=[...new Set(all.map(x=>x.applied_position).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('');render()}function filtered(){const q=$('q').value.trim().toLowerCase(),job=$('job').value,status=$('status').value,date=$('date').value,salary=Number($('salary').value||0),exp=$('exp').value;return all.filter(x=>(!q||[x.Candidate_ID,x.full_name,x.primary_phone,x.email].some(v=>String(v||'').toLowerCase().includes(q)))&&(!job||x.applied_position===job)&&(!status||x.Status===status)&&(!date||String(x.Submission_Date).slice(0,10)===date)&&(!salary||Number(x.expected_salary||0)<=salary)&&(!exp||(exp==='yes')===!!x.has_experience)).sort((a,b)=>String(a[sortKey]??'').localeCompare(String(b[sortKey]??''),undefined,{numeric:true})*sortDir)}function render(){const f=filtered(),count=s=>all.filter(x=>s.includes(x.Status)).length;$('cards').innerHTML=[['إجمالي المرشحين',all.length],['جديد',count(['جديد'])],['مقابلات',count(['مرشح للمقابلة','تمت المقابلة'])],['مقبول',count(['مقبول'])],['مرفوض',count(['مرفوض'])]].map(x=>`<div class="card">${x[0]}<b>${x[1]}</b></div>`).join('');$('rows').innerHTML=f.length?f.map(x=>`<tr><td>${esc(x.Candidate_ID)}</td><td>${esc(x.full_name)}</td><td>${esc(x.primary_phone)}</td><td>${esc(x.applied_position)}</td><td>${esc(String(x.Submission_Date).slice(0,10))}</td><td>${esc(money(x.expected_salary))}</td><td>${x.has_experience?'نعم':'لا'}</td><td>${esc(x.Status||'جديد')}</td><td class="actions"><button onclick="openCandidate('${esc(x.Candidate_ID)}')">التفاصيل</button><a href="${esc(x.print_url)}" target="_blank"><button type="button">عرض / طباعة</button></a></td></tr>`).join(''):`<tr><td colspan="9" class="empty">لا توجد نتائج</td></tr>`}function openCandidate(id){current=id;google.script.run.withSuccessHandler(show).withFailureHandler(fail).getHRCandidate(id)}const labels={first_name:'الاسم الأول',father_name:'اسم الأب',grandfather_name:'اسم الجد',surname:'اللقب',gender:'الجنس',birth_date:'تاريخ الميلاد',marital_status:'الحالة الزوجية',primary_phone:'الهاتف',secondary_phone:'الهاتف الثاني',email:'البريد الإلكتروني',address:'السكن',landmark:'أقرب نقطة',education_level:'التحصيل',education_institution:'المؤسسة',graduation_year:'سنة التخرج',currently_employed:'يعمل حاليًا',current_employer:'جهة العمل',current_job_title:'المسمى الحالي',current_start_date:'تاريخ المباشرة',current_salary:'الراتب الحالي',notice_period:'فترة الإشعار',reason_for_leaving_current:'سبب ترك العمل',microsoft_office_level:'Office',computer_level:'الحاسوب',data_entry_level:'إدخال البيانات',erp_level:'ERP',excel_level:'Excel',english_level:'الإنجليزية',other_technical_skills:'مهارات أخرى',applied_position:'الوظيفة',expected_salary:'الراتب المتوقع',how_heard_about_job:'مصدر الوظيفة',available_start_date:'المباشرة المتاحة'};function rows(obj,keys){return keys.map(k=>obj[k]!==''&&obj[k]!=null?`<div class="row"><span>${labels[k]||k}</span><b>${esc(k.includes('salary')?money(obj[k]):obj[k])}</b></div>`:'').join('')}function show(d){const c=d.candidate;$('title').textContent=c.full_name;$('cid').textContent=c.Candidate_ID;$('newStatus').innerHTML=d.statuses.map(s=>`<option ${s===(c.Status||'جديد')?'selected':''}>${esc(s)}</option>`).join('');$('hrNotes').value=c.HR_Notes||'';$('statusNote').value='';$('print').href=c.print_url;const sets=[['المعلومات الشخصية',['first_name','father_name','grandfather_name','surname','gender','birth_date','marital_status']],['الاتصال والسكن',['primary_phone','secondary_phone','email','address','landmark']],['التحصيل الدراسي',['education_level','education_institution','graduation_year']],['الوضع الوظيفي',['currently_employed','current_employer','current_job_title','current_start_date','current_salary','notice_period','reason_for_leaving_current']],['المهارات',['microsoft_office_level','computer_level','data_entry_level','erp_level','excel_level','english_level','other_technical_skills']],['معلومات التقديم',['applied_position','expected_salary','how_heard_about_job','available_start_date']]];$('details').innerHTML='<div class="grid">'+sets.map(s=>`<section class="section"><h3>${s[0]}</h3>${rows(c,s[1])}</section>`).join('')+`<section class="section"><h3>الخبرات</h3>${d.experiences.length?d.experiences.map((x,i)=>`<div class="exp"><b>الخبرة ${i+1}</b>${rows(x,Object.keys(x))}</div>`).join(''):'لا توجد خبرات'}</section></div>`;$('history').innerHTML=d.history.length?d.history.map(x=>`<tr><td>${esc(new Date(x.Timestamp).toLocaleString('ar-IQ'))}</td><td>${esc(x.Old_Status)}</td><td>${esc(x.New_Status)}</td><td>${esc(x.Note)}</td></tr>`).join(''):'<tr><td colspan="4">لا يوجد سجل سابق</td></tr>';$('err').textContent='';dlg.showModal()}$('save').onclick=()=>{google.script.run.withSuccessHandler(d=>{show(d);load()}).withFailureHandler(e=>$('err').textContent=e.message||e).updateHRCandidate(current,$('newStatus').value,$('statusNote').value,$('hrNotes').value)};document.querySelectorAll('.filters input,.filters select').forEach(x=>x.addEventListener('input',render));document.querySelectorAll('th[data-sort]').forEach(x=>x.onclick=()=>{const k=x.dataset.sort;sortDir=sortKey===k?-sortDir:1;sortKey=k;render()});function fail(e){alert(e.message||e)}load();
</script></body></html>
