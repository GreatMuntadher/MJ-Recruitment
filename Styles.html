<style>
:root{--navy:#020812;--navy2:#04111f;--surface:rgba(7,24,38,.82);--cyan:#18bfff;--teal:#2dd4bf;--gold:#d4af37;--gold2:#f0cd5a;--text:#f4fbff;--muted:#8fa8b8;--muted2:#778b9b;--line:rgba(74,207,255,.17);--soft:rgba(255,255,255,.08);--danger:#ff6b7d;--radius:22px;--shadow:0 22px 70px rgba(0,0,0,.42);--font:'Cairo',Tahoma,Arial,sans-serif}
*{box-sizing:border-box}html{color-scheme:dark;scroll-behavior:smooth}body{min-height:100vh;margin:0;background:radial-gradient(circle at 80% 0,rgba(24,191,255,.09),transparent 29%),linear-gradient(180deg,var(--navy),#03101c 50%,#02101a);color:var(--text);font:16px/1.8 var(--font);overflow-x:hidden}.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(24,191,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(24,191,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 74%);pointer-events:none}.bg-orb{position:fixed;border-radius:50%;filter:blur(85px);pointer-events:none;opacity:.75}.orb-1{width:420px;height:420px;right:-130px;top:-140px;background:rgba(24,191,255,.16)}.orb-2{width:330px;height:330px;left:-130px;bottom:-130px;background:rgba(45,212,191,.10)}
.site-header{position:relative;z-index:10;border-bottom:1px solid rgba(24,191,255,.13);background:linear-gradient(180deg,rgba(4,16,28,.9),rgba(3,12,22,.76));backdrop-filter:blur(18px);box-shadow:0 8px 32px rgba(0,0,0,.16)}.header-inner{width:min(1220px,calc(100% - 40px));min-height:78px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px}.logo{display:flex;align-items:center;gap:12px}.logo-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,rgba(24,191,255,.2),rgba(6,28,44,.64));border:1px solid rgba(24,191,255,.4);box-shadow:0 0 24px rgba(24,191,255,.2),inset 0 1px rgba(255,255,255,.12)}.logo-icon img{width:34px;height:34px;object-fit:contain}.logo-text{display:flex;align-items:center;gap:9px;color:#dbeaf0;font-size:.96rem;font-weight:800}.logo-text strong{color:#fff}.logo-text i,footer i{width:4px;height:4px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}.header-caption{color:var(--muted);font-size:.82rem;font-weight:700}
main{position:relative;z-index:1;width:min(920px,calc(100% - 36px));margin:auto;padding:32px 0 24px}.breadcrumb{display:flex;align-items:center;gap:9px;margin-bottom:18px;color:var(--muted);font-size:.8rem;font-weight:700}.breadcrumb b{color:rgba(255,255,255,.26)}.breadcrumb strong{color:#d9f7ff}.intro{margin-bottom:24px}.eyebrow,.card-kicker{display:inline-flex;align-items:center;gap:8px;color:var(--cyan);font-size:.76rem;font-weight:900}.eyebrow{padding:6px 13px;margin-bottom:12px;border:1px solid rgba(24,191,255,.22);border-radius:999px;background:rgba(24,191,255,.08)}.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 13px var(--cyan)}h1{margin:0;font-size:clamp(2rem,5vw,3.2rem);line-height:1.35;font-weight:900;letter-spacing:-.03em}h1 em{color:var(--gold2);font-style:normal}.intro p{max-width:700px;margin:9px 0 0;color:var(--muted);font-weight:600}
.card{position:relative;overflow:hidden;padding:0 32px 32px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,rgba(10,34,54,.82),rgba(5,22,38,.78));box-shadow:var(--shadow);backdrop-filter:blur(18px)}.card::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(24,191,255,.55),transparent)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 -32px;padding:25px 32px 22px;border-bottom:1px solid var(--soft);background:linear-gradient(135deg,rgba(24,191,255,.105),rgba(45,212,191,.025))}.card-kicker{font-size:.68rem}.card h2{margin:3px 0 0;font-size:clamp(1.35rem,3vw,1.8rem);line-height:1.5;font-weight:900;outline:0}.card h2:focus-visible{border-radius:8px;box-shadow:0 0 0 3px rgba(24,191,255,.2)}.secure-badge{display:inline-flex;align-items:center;gap:7px;flex:none;padding:6px 11px;border:1px solid rgba(45,212,191,.24);border-radius:999px;background:rgba(45,212,191,.07);color:#bcefe7;font-size:.72rem;font-weight:800}.secure-badge i{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:rgba(45,212,191,.14);color:var(--teal);font-style:normal}
.progress-wrap{margin:24px 0 28px;padding:16px 18px;border:1px solid rgba(143,168,184,.14);border-radius:15px;background:rgba(2,12,22,.33)}#progress{margin-bottom:9px;color:#cfe8ef;font-size:.78rem;font-weight:800}progress{display:block;width:100%;height:7px;border:0;border-radius:999px;overflow:hidden;background:rgba(143,168,184,.15);accent-color:var(--cyan)}progress::-webkit-progress-bar{background:rgba(143,168,184,.15);border-radius:999px}progress::-webkit-progress-value{border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--teal));box-shadow:0 0 18px rgba(24,191,255,.46)}progress::-moz-progress-bar{border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--teal))}
#fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.field{min-width:0}.wide,.experience,.review-section{grid-column:1/-1}.field>label,.field>legend{display:block;margin-bottom:8px;color:var(--text);font-size:.88rem;font-weight:900}.field>h3{margin:6px 0 -2px;padding:0 0 10px;border-bottom:1px solid var(--soft);color:#dff8ff;font-size:1rem}.field>h3::before{content:"";display:inline-block;width:28px;height:2px;margin-left:9px;vertical-align:middle;border-radius:999px;background:linear-gradient(90deg,var(--cyan),transparent)}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;min-height:51px;padding:12px 14px;border:1px solid rgba(143,168,184,.25);border-radius:12px;background:rgba(2,12,22,.67);color:var(--text);font:600 .94rem/1.6 var(--font);outline:0;transition:.22s ease}textarea{min-height:126px;resize:vertical}select option{background:#071826;color:var(--text)}input::placeholder,textarea::placeholder{color:var(--muted2)}input:focus,select:focus,textarea:focus,button:focus-visible{border-color:rgba(24,191,255,.78);box-shadow:0 0 0 4px rgba(24,191,255,.11),0 0 24px rgba(24,191,255,.09);outline:0}input[type=date],input[type=email],input[type=tel],.money-input input{direction:ltr;text-align:right}.money-input{position:relative}.money-input input{padding-left:64px}.money-suffix{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gold2);font-weight:900;font-size:.82rem;pointer-events:none}.help{margin-top:7px;color:var(--muted);font-size:.75rem;font-weight:600}.error{min-height:21px;margin-top:4px;color:#ff9aac;font-size:.76rem;font-weight:800}.error:not(:empty)::before{content:"⚠ ";font-size:.7rem}.invalid{border-color:rgba(255,107,125,.75)!important;box-shadow:0 0 0 3px rgba(255,107,125,.09)!important}
.choices{display:flex;flex-wrap:wrap;gap:10px;padding:11px;border:1px solid rgba(143,168,184,.17);border-radius:12px;background:rgba(2,12,22,.38)}.choices label{display:flex;align-items:center;gap:9px;min-width:98px;margin:0;padding:9px 13px;border:1px solid rgba(24,191,255,.17);border-radius:12px;background:rgba(2,12,22,.44);color:var(--text);font-size:.85rem;font-weight:800;cursor:pointer;transition:.2s ease}.choices label:hover{border-color:rgba(24,191,255,.4);background:rgba(24,191,255,.07)}input[type=checkbox],input[type=radio]{width:19px;height:19px;flex:none;margin:0;accent-color:var(--cyan)}.field>input[type=checkbox]{margin:7px 0 0 10px;vertical-align:middle}.field:has(>input[type=checkbox]){padding:18px;border:1px solid rgba(212,175,55,.24);border-radius:16px;background:linear-gradient(145deg,rgba(212,175,55,.075),rgba(2,12,22,.34))}
#message:not(:empty){margin-bottom:22px;padding:13px 15px;border:1px solid rgba(255,107,125,.3);border-right:4px solid var(--danger);border-radius:13px;background:rgba(255,68,102,.09);color:#ffd8df;font-size:.86rem;font-weight:800}.experience{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px;padding:22px;border:1px solid rgba(24,191,255,.18);border-radius:18px;background:linear-gradient(145deg,rgba(5,25,41,.58),rgba(2,12,22,.3));box-shadow:inset 0 1px rgba(255,255,255,.025)}.experience>h3{margin:0;color:#dff8ff}.experience>h3::before{content:"✦";margin-left:8px;color:var(--gold2)}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:49px;padding:12px 25px;border:0;border-radius:999px;background:linear-gradient(135deg,#0aa6df,var(--cyan));box-shadow:0 10px 26px rgba(24,191,255,.23);color:#02101a;font:900 .92rem/1.4 var(--font);cursor:pointer;transition:.2s ease}button:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(24,191,255,.34)}button.secondary{border:1px solid rgba(24,191,255,.36);background:rgba(24,191,255,.055);box-shadow:none;color:#dff8ff}button.secondary:hover{background:rgba(24,191,255,.12);border-color:rgba(24,191,255,.65)}button:disabled{cursor:wait;opacity:.5;transform:none}#next::after{content:"←"}#back::before{content:"→"}.form-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:29px;padding-top:24px;border-top:1px solid var(--soft)}
.review-section{position:relative;padding:21px;border:1px solid rgba(24,191,255,.15);border-radius:17px;background:rgba(2,12,22,.3)}.review-section h3{margin:0 0 14px;padding-left:90px;color:#dff8ff;font-size:1rem}.review-section>button{position:absolute;top:15px;left:15px;min-height:36px;padding:6px 15px;font-size:.74rem}.review-row{display:grid;grid-template-columns:1fr 1.35fr;gap:18px;padding:9px 0;border-top:1px solid rgba(255,255,255,.045);font-size:.83rem;overflow-wrap:anywhere}.review-row span{color:var(--muted)}.review-row b{color:#eefbff}
.success{width:100%;max-width:620px;margin-inline:auto;padding:50px 24px 48px;text-align:center;outline:0}.success-mark{width:86px;height:86px;margin:0 auto 20px;border-radius:50%;filter:drop-shadow(0 0 16px rgba(24,191,255,.19));animation:successAppear .58s cubic-bezier(.2,.8,.25,1) both,successPulse .28s ease-out .61s both}.success-mark svg{display:block;width:100%;height:100%;overflow:visible}.success-ring{fill:rgba(24,191,255,.07);stroke:var(--teal);stroke-width:2.5}.success-check{fill:none;stroke:#bffaf1;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:38;stroke-dashoffset:38;animation:successCheck .38s ease-out .27s forwards}.success-title{margin:0 0 10px!important;color:var(--text);font-size:clamp(1.55rem,4vw,2.05rem)!important}.success-message{max-width:540px;margin:0 auto 22px;color:var(--muted);font-size:.92rem;font-weight:600;line-height:1.95;white-space:pre-line}.success-label{color:#cfe8ef;font-size:.78rem;font-weight:800}.success-id{display:block;max-width:100%;margin:5px auto 8px;color:var(--gold2);font:900 clamp(1.5rem,5vw,2rem)/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;direction:ltr;overflow-wrap:anywhere}.success-note{margin:0;color:var(--muted2);font-size:.76rem;font-weight:600}.success:focus-visible{border-radius:16px;box-shadow:0 0 0 3px rgba(24,191,255,.18)}@keyframes successAppear{0%{opacity:0;transform:scale(.62)}72%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}@keyframes successCheck{to{stroke-dashoffset:0}}@keyframes successPulse{50%{transform:scale(1.045);filter:drop-shadow(0 0 22px rgba(45,212,191,.27))}100%{transform:scale(1);filter:drop-shadow(0 0 16px rgba(24,191,255,.19))}}
footer{display:flex;align-items:center;justify-content:center;gap:10px;padding:26px 0 4px;color:var(--muted);font-size:.74rem;font-weight:700}fieldset{margin:0;padding:0;border:0}[hidden]{display:none!important}
@media(max-width:760px){.header-inner{width:min(100% - 28px,920px);min-height:68px}.logo-icon{width:42px;height:42px;border-radius:13px}.logo-icon img{width:30px;height:30px}.logo-text{font-size:.82rem}.header-caption{display:none}main{width:min(100% - 24px,920px);padding-top:22px}.breadcrumb{font-size:.72rem}.intro{margin-bottom:18px}.intro p{font-size:.86rem}.card{padding:0 20px 24px;border-radius:20px}.card-head{margin:0 -20px;padding:21px 20px 18px}.secure-badge{display:none}.progress-wrap{margin:20px 0 23px;padding:14px}#fields,.experience{grid-template-columns:1fr;gap:17px}.field{grid-column:1}.review-row{grid-template-columns:1fr;gap:1px}.form-actions{align-items:stretch}.form-actions button{flex:1}.experience{padding:18px}}
@media(max-width:480px){.logo-text i,.logo-text strong{display:none}h1{font-size:1.85rem}.card{padding-inline:16px}.card-head{margin-inline:-16px;padding-inline:16px}.card h2{font-size:1.28rem}.form-actions{flex-direction:column-reverse}.form-actions button{width:100%}.choices{display:grid;grid-template-columns:1fr 1fr}.choices label{min-width:0}.review-section{padding:17px}.review-section h3{padding-left:70px}.success{padding:38px 8px 36px}.success-mark{width:74px;height:74px;margin-bottom:18px}.success-message{font-size:.84rem}.success-note{font-size:.72rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition-duration:.01ms!important}.success-mark,.success-check{animation:none!important}.success-check{stroke-dashoffset:0}}
</style>
